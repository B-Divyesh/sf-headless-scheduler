server {
  listen 8080;
  listen [::]:8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  autoindex off;
  server_tokens off;
  charset utf-8;

  include /etc/nginx/snippets/security-headers.conf;

  # The generated Vite files are content-addressed. Cache them indefinitely.
  location ^~ /assets/ {
    try_files $uri =404;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # The service worker must be checked on each visit so its versioned cache can update.
  location = /sw.js {
    try_files $uri =404;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }

  # Some static hosts default .webmanifest to octet-stream; declare the PWA type explicitly.
  location = /manifest.webmanifest {
    try_files $uri =404;
    include /etc/nginx/snippets/security-headers.conf;
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
  }

  # HTML is never stored by shared or browser caches.
  location = / {
    try_files /index.html =404;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
  }

  location = /index.html {
    try_files $uri =404;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
  }

  location = /demo { try_files /demo/index.html =404; include /etc/nginx/snippets/security-headers.conf; add_header Cache-Control "no-store" always; }
  location = /privacy { try_files /privacy/index.html =404; include /etc/nginx/snippets/security-headers.conf; add_header Cache-Control "no-store" always; }
  location = /terms { try_files /terms/index.html =404; include /etc/nginx/snippets/security-headers.conf; add_header Cache-Control "no-store" always; }
  location = /404.html { internal; include /etc/nginx/snippets/security-headers.conf; add_header Cache-Control "no-store" always; }

  location ~* \.html$ {
    try_files $uri =404;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
  }

  # Public images and icons are static, but are deliberately not assumed hashed.
  location ~* \.(?:avif|gif|ico|jpe?g|png|svg|webp)$ {
    try_files $uri =404;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=86400" always;
  }

  location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
  }

  # Serve known static files and return the designed 404 for unknown routes.
  location / {
    try_files $uri $uri/ =404;
    error_page 404 /404.html;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
  }
}
