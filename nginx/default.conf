server {
  listen 8080;
  listen [::]:8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  autoindex off;
  server_tokens off;
  charset utf-8;

  include /etc/nginx/snippets/security-headers.conf;

  # The generated Vite files are content-addressed. Cache them indefinitely.
  location ^~ /assets/ {
    try_files $uri =404;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # The service worker must be checked on each visit so its versioned cache can update.
  location = /sw.js {
    try_files $uri =404;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }

  # HTML is never stored by shared or browser caches.
  location = / {
    try_files /index.html =404;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
  }

  location = /index.html {
    try_files $uri =404;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
  }

  location ~* \.html$ {
    try_files $uri =404;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
  }

  # Public images and icons are static, but are deliberately not assumed hashed.
  location ~* \.(?:avif|gif|ico|jpe?g|png|svg|webp)$ {
    try_files $uri =404;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=86400" always;
  }

  location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
  }

  # Serve static public files when present, otherwise hand client routes to the SPA.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
