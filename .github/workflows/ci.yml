name: verify

on:
  push:
  pull_request:

jobs:
  library-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      # This removes dist/package first; npm pack must rebuild it through prepack,
      # then a brand-new consumer installs and imports ESM, CJS, and React targets.
      - run: npm run check:pack
